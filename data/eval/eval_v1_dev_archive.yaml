    bucket: B4
    query: "订单1103 商品完好，不想要了，我要退款"
    expect_route: rules
    expect_refund: {eligible: false, amount: 0, reason_code: "not_applicable"}
    expect_answer_contains: ["不适用|不符合|无法|不能|不支持|没法"]
    expected_output: "不适用|不符合退款条件"
