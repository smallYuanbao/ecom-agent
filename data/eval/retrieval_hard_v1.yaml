# 困难检索集 v1：专测「稀有词」上的策略差异
#
# 为什么单独一份：knowledge_v1 的 42 条查询里，dense 已经 hit@3 = 1.00，
# 再比也不会变。这份集子刻意堆型号（ST-20 / CS-04 / FB-30）、法条号
# （第七条 / 第八条）、地区（西藏 / 内蒙古 / 港澳台）、发票类型等**稀有 token**——
# 这些是 BM25 的主场，也是「dense 是不是真的够用」唯一可能翻案的地方。
#
# 字段与 knowledge_v1 相同：
#   - `expect_ids`：正确答案所在 chunk，任一命中即算 hit；
#   - `queries[].style`：formal / colloquial，用于观察口语化衰减；
#   - 检索指标不需要 `points`，所以这里不写。
#
# 注意：这是**检索集**，不参与生成/闸的评测；不要拿它调 prompt。

version: v1
cases:
  - id: H01
    bucket: hard_product
    expect_ids: ["products#婴儿推车 ST-20 轻便伞车"]
    should_refuse: false
    queries:
      - {q: "ST-20 的最大承重是多少", style: formal}
      - {q: "ST-20 折叠后能带上飞机吗", style: colloquial}

  - id: H02
    bucket: hard_product
    expect_ids: ["products#婴儿推车 ST-60 高景观"]
    should_refuse: false
    queries:
      - {q: "ST-60 新生儿可以平躺吗", style: formal}
      - {q: "ST-60 最大能承重多少", style: colloquial}

  - id: H03
    bucket: hard_product
    expect_ids:
      - "products#儿童安全座椅 CS-04"
      - "products#型号交叉点与选购提示"
    should_refuse: false
    queries:
      - {q: "CS-04 可以反向安装到多少公斤", style: formal}
      - {q: "CS-04L 和 CS-04 有什么区别", style: colloquial}

  - id: H04
