# Ch07 端到端评测集 v1
#
# 44 条，7 桶。字段说明：
#   - expect_route：期望出口；`any` 表示只约束行为，不约束路由（如注入）
#   - expected_output：EvalFlow 用，`/` 分隔必须出现的要点组，组内 `|` 任选
#   - expect_ids：知识出口期望命中的 chunk id（任一即可）
#   - expect_fields：B2 的字段断言，值要出现在 answer 或 signals
#   - expect_refund：B3/B4 的退款信号断言（eligible / amount / reason_code）
#   - expect_actions：期望的前端动作（目前只有 transfer_human）
#   - expect_answer_contains：回答里必须出现的片段（任一即可）
#   - split：dev = 已参与调参；test = 盲测，只跑不改
#
# 订单 11xx 来自 scripts/seed_eval.py（时间相对运行时刻生成）；
# 1001–1005 来自 scripts/seed.py（u1 的演示订单）。
# 使用前先跑：init_db → seed → seed_eval。

version: v1
items:
  # ── B1 知识问答（10）─────────────────────────────────────
  - id: K01
    bucket: B1
    query: "退货政策是什么"
    expect_route: knowledge
    expect_ids:
