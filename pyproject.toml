[project]
name = "ecom-agent"
version = "0.1.0"
description = "面向消费者的电商售后客服 Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "langgraph>=1.2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"        # async def test_* 不用逐个加 @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"  # 显式声明，避免 pytest-asyncio 未来变更
testpaths = ["tests"]
pythonpath = ["."]           # 让 tests/ 能 import app.*

[tool.ruff]
line-length = 100
target-version = "py311"
